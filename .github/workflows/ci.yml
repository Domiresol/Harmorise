name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: harmorise
          POSTGRES_PASSWORD: harmorise
          POSTGRES_DB: harmorise_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harmorise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://harmorise:harmorise@localhost:5432/harmorise_db
      JWT_SECRET: ci-test-jwt-secret
      PHONE_TOKEN_SECRET: ci-test-phone-token-secret
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Task distribution via Nx Cloud disabled - using standard e2e instead of e2e-ci
      # To enable Nx Cloud, add NX_CLOUD_ACCESS_TOKEN to GitHub secrets and uncomment:
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Diagnostic: show prisma runtime files and installed package (helps debug missing files)
      - name: Check @prisma/client runtime files
        run: |
          echo "Listing prisma runtime (if present)"
          ls -la node_modules/@prisma/client/runtime || true
          echo "Listing hoisted prisma (.prisma) runtime (if present)"
          ls -la node_modules/.prisma/client/runtime || true
          echo "npm ls @prisma/client (show installed location)"
          npm ls @prisma/client || true

      # Generate Prisma client
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      # Install Playwright browsers for E2E tests
      - run: npx playwright install --with-deps

      # Run format check and main tasks
      - run: npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
